name: Deploy Meatwash website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check website assets and code
        run: node scripts/check.mjs
      # Версия к адресам CSS и JS: иначе после выкладки браузер смешивает
      # новый HTML со старыми стилями из кэша (у GitHub Pages max-age=600).
      - name: Stamp asset versions
        run: node scripts/stamp-assets.mjs "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
